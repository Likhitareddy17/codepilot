[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot"
version = "0.1.0"
description = "AI software engineering agent for CodePilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
codepilot = "codepilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The canonical sandbox has intentionally failing tests; never collect it from the project root.
norecursedirs = ["sandbox_repo", ".*", "build", "dist", "node_modules", "venv", "runs"]

[tool.setuptools.packages.find]
include = ["codepilot*"]
